<!doctype html>
<html>
    <head>
        <title>Emotion Detector</title>
        <script>
            function RunSentimentAnalysis() {
                var textToAnalyze = document.getElementById("textToAnalyze").value;
                var xhttp = new XMLHttpRequest();
                xhttp.onreadystatechange = function () {
                    if (this.readyState == 4) {
                        if (this.status == 200) {
                            document.getElementById("system_response").innerHTML = this.responseText;
                        } else {
                            console.error("Server returned status: " + this.status);
                            document.getElementById("system_response").innerHTML =
                                "Server returned error: " + this.status;
                        }
                    }
                };
                xhttp.onerror = function () {
                    console.error("Network error occurred");
                    document.getElementById("system_response").innerHTML = "Network error occurred";
                };
                xhttp.open("GET", "/emotionDetector?textToAnalyze=" + encodeURIComponent(textToAnalyze), true);
                xhttp.send();
            }
        </script>
    </head>
    <body style="font-family: Arial, sans-serif; margin: 40px">
        <h1>Emotion Detector Application</h1>
        <p>Enter the text you want to analyze:</p>
        <input
            type="text"
            id="textToAnalyze"
            style="width: 450px; padding: 10px; font-size: 14px"
            placeholder="Type statement here..."
        /><br /><br />
        <button
            onclick="RunSentimentAnalysis()"
            style="padding: 10px 20px; font-size: 14px; cursor: pointer"
        >
            Run Emotion Detection
        </button>
        <div
            id="system_response"
            style="
                margin-top: 25px;
                font-weight: bold;
                font-size: 16px;
                color: #111;
            "
        ></div>
    </body>
</html>
